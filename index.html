<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAYMENT DIKZZ STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue-glow: #00aaff;
    --blue-mid: #0066cc;
    --blue-soft: #4db8ff;
    --blue-border: #1e4970;
    --blue-deep: #0a1a2e;
    --bg-deep: #050810;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg-deep);
    font-family: 'Press Start 2P', 'Courier New', monospace;
    color: #cfe8ff;
    overflow-x: hidden;
  }

  /* ===== BACKGROUND PIXEL GRID STATIS (ANTI LAG) ===== */
  body {
    background-image:
      radial-gradient(circle at 50% 0%, #0a1a33 0%, #050810 65%),
      repeating-linear-gradient(0deg, rgba(0,170,255,0.045) 0px, rgba(0,170,255,0.045) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(90deg, rgba(0,170,255,0.045) 0px, rgba(0,170,255,0.045) 1px, transparent 1px, transparent 4px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px 15px 60px;
  }

  /* ================= WRAPPER ================= */
  .wrapper {
    width: 100%;
    max-width: 820px;
    position: relative;
  }

  /* ================= HEADER PIXEL ================= */
  .header {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
    padding: 26px 14px 22px;
    background:
      linear-gradient(180deg, #0c1830 0%, #070d1a 100%);
    border: 3px solid var(--blue-border);
    box-shadow:
      0 0 0 2px #040a14,
      0 0 20px var(--blue-mid),
      0 0 40px rgba(0,102,204,0.45),
      inset 0 0 22px rgba(0,102,204,0.28);
  }

  /* pixel corners */
  .header::before,
  .header::after {
    content: "";
    position: absolute;
    width: 12px; height: 12px;
    background: var(--blue-glow);
    box-shadow: 0 0 12px var(--blue-glow);
  }
  .header::before { top: -6px; left: -6px; }
  .header::after  { bottom: -6px; right: -6px; }

  .header .badge {
    display: inline-block;
    font-size: 0.5rem;
    letter-spacing: 3px;
    color: #8fc4ff;
    background: #0a1a2e;
    border: 2px solid #1e4970;
    padding: 5px 12px;
    margin-bottom: 14px;
    box-shadow: 0 0 10px rgba(0,170,255,0.5), inset 0 0 8px rgba(0,102,204,0.3);
    text-shadow: 0 0 6px var(--blue-glow);
  }

  .header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.45rem;
    color: #eaf6ff;
    text-shadow:
      0 0 6px var(--blue-glow),
      0 0 16px var(--blue-mid),
      0 0 26px #004488,
      0 3px 0 #001a33;
    letter-spacing: 3px;
    line-height: 1.6;
    word-break: break-word;
  }

  .header h1 .accent {
    color: var(--blue-glow);
    text-shadow:
      0 0 10px var(--blue-glow),
      0 0 22px var(--blue-mid),
      0 3px 0 #001a33;
  }

  .header .subtitle {
    margin-top: 16px;
    font-size: 0.55rem;
    color: #6fa8d8;
    letter-spacing: 3px;
    text-shadow: 0 0 6px var(--blue-mid);
  }

  /* ================= GRID METODE ================= */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .card {
    background: linear-gradient(145deg, #0c1828 0%, #08111e 100%);
    border: 3px solid var(--blue-border);
    padding: 20px 14px 18px;
    position: relative;
    text-align: center;
    box-shadow:
      0 0 0 2px #040a14,
      0 0 16px rgba(0,102,204,0.55),
      inset 0 0 12px rgba(0,102,204,0.18);
    transition: none; /* ANTI LAG */
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 9px; height: 9px;
    background: var(--blue-glow);
    box-shadow: 0 0 9px var(--blue-glow);
  }
  .card::after {
    content: "";
    position: absolute;
    bottom: 0; right: 0;
    width: 9px; height: 9px;
    background: var(--blue-glow);
    box-shadow: 0 0 9px var(--blue-glow);
  }

  .card .icon {
    font-size: 2rem;
    margin-bottom: 12px;
    display: block;
    filter: drop-shadow(0 0 10px var(--blue-glow));
  }

  .card .name {
    font-size: 0.7rem;
    color: #9cc9f0;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 0 0 6px var(--blue-mid), 0 2px 0 #001a33;
    text-transform: uppercase;
  }

  .card .number {
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 1rem;
    color: #ffffff;
    background: #04080f;
    border: 2px solid #14385c;
    padding: 9px 6px;
    letter-spacing: 1px;
    word-break: break-all;
    box-shadow: inset 0 0 8px rgba(0,102,204,0.35), 0 0 8px rgba(0,170,255,0.5);
  }

  .card .owner {
    margin-top: 12px;
    font-size: 0.55rem;
    color: #7fb2dd;
    letter-spacing: 1px;
    text-shadow: 0 0 5px #003366;
  }

  /* ================= QRIS SECTION ================= */
  .qris-box {
    background: linear-gradient(180deg, #0a1626 0%, #060c18 100%);
    border: 4px solid var(--blue-border);
    padding: 26px 18px 24px;
    position: relative;
    box-shadow:
      0 0 0 2px #040a14,
      0 0 28px var(--blue-mid),
      0 0 55px rgba(0,102,204,0.38),
      inset 0 0 24px rgba(0,102,204,0.22);
    text-align: center;
  }

  .qris-box::before,
  .qris-box::after {
    content: "";
    position: absolute;
    width: 14px; height: 14px;
    background: var(--blue-glow);
    box-shadow: 0 0 14px var(--blue-glow);
  }
  .qris-box::before { top: -7px; left: -7px; }
  .qris-box::after  { bottom: -7px; right: -7px; }

  .qris-title {
    font-size: 0.9rem;
    color: #cfe8ff;
    letter-spacing: 5px;
    margin-bottom: 20px;
    text-shadow:
      0 0 8px var(--blue-glow),
      0 0 18px var(--blue-mid),
      0 3px 0 #001a33;
  }

  .qris-frame {
    display: inline-block;
    background: #04080f;
    border: 4px solid #1e4970;
    padding: 12px;
    box-shadow:
      0 0 0 2px #040a14,
      0 0 25px var(--blue-glow),
      inset 0 0 18px rgba(0,102,204,0.42);
    margin-bottom: 22px;
    max-width: 280px;
    width: 100%;
  }

  .qris-frame img {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    filter: drop-shadow(0 0 10px var(--blue-glow));
    border: 2px solid #0f2b44;
    background: #ffffff;
  }

  /* ================= TOMBOL ================= */
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 6px;
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem;
    letter-spacing: 1.5px;
    color: #dff0ff;
    background: linear-gradient(180deg, #122a44 0%, #0a1828 100%);
    border: 3px solid #1e5a8a;
    padding: 13px 20px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow:
      0 0 0 2px #040a14,
      0 0 16px var(--blue-mid),
      inset 0 0 10px rgba(0,102,204,0.3);
    transition: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active {
    background: #1a3a5c;
    box-shadow:
      0 0 0 2px #040a14,
      0 0 28px var(--blue-glow),
      inset 0 0 18px rgba(0,170,255,0.55);
    color: #ffffff;
  }

  .btn .ico { font-size: 1rem; }

  /* ================= FOOTER ================= */
  .footer {
    text-align: center;
    margin-top: 26px;
    padding: 16px 8px;
    font-size: 0.5rem;
    color: #4a6f94;
    letter-spacing: 2px;
    text-shadow: 0 0 5px #002244;
    border-top: 2px dashed #14385c;
  }

  .footer .brand {
    color: var(--blue-glow);
    text-shadow: 0 0 8px var(--blue-glow);
  }

  /* ================= TOAST ================= */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: #0a1828;
    border: 3px solid #1e5a8a;
    color: #dff0ff;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.55rem;
    padding: 14px 22px;
    box-shadow: 0 0 0 2px #040a14, 0 0 22px var(--blue-glow);
    z-index: 999;
    letter-spacing: 1px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    max-width: 90vw;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 560px) {
    .header h1 { font-size: 1rem; letter-spacing: 2px; }
    .header .subtitle { font-size: 0.45rem; letter-spacing: 2px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
    .card .number { font-size: 0.85rem; }
    .card .name { font-size: 0.6rem; }
    .qris-title { font-size: 0.7rem; letter-spacing: 2px; }
    .btn { font-size: 0.5rem; padding: 11px 14px; }
    .qris-frame { max-width: 220px; }
  }

  @media (max-width: 360px) {
    .btn { font-size: 0.45rem; padding: 10px 10px; }
    .qris-frame { max-width: 180px; }
  }
</style>
</head>
<body>

<div class="wrapper">

  <!-- HEADER -->
  <div class="header">
    <div class="badge">✦ PIXEL BLUE EDITION ✦</div>
    <h1><span class="accent">PAYMENT</span><br>DIKZZ STORE</h1>
    <div class="subtitle">• SCAN • BAYAR • SELESAI •</div>
  </div>

  <!-- GRID METODE -->
  <div class="grid">

    <div class="card">
      <span class="icon">💠</span>
      <div class="name">DANA</div>
      <div class="number">081540075064</div>
      <div class="owner">A/n R*******S</div>
    </div>

    <div class="card">
      <span class="icon">⚡</span>
      <div class="name">GOPAY</div>
      <div class="number">08154005064</div>
      <div class="owner">A/n DHYKA STORE</div>
    </div>

  </div>

  <!-- QRIS SECTION -->
  <div class="qris-box">
    <div class="qris-title">✦ QRIS ✦</div>

    <div class="qris-frame">
      <img
        id="qrisImg"
        src="https://files.catbox.moe/8urz1a.jpg"
        alt="QRIS PAYMENT DIKZZ STORE"
        crossorigin="anonymous"
        loading="lazy"
      >
    </div>

    <div class="btn-group">
      <button class="btn" id="copyBtn">
        <span class="ico">📋</span> Salin QRIS
      </button>
      <button class="btn" id="downloadBtn">
        <span class="ico">⬇️</span> Download
      </button>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    © <span class="brand">DIKZZ STORE</span> • PIXEL BLUE PAYMENT SYSTEM
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast">✓ BERHASIL</div>

<script>
(function () {
  const QRIS_URL = "https://files.catbox.moe/8urz1a.jpg";
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  /* ============ SALIN GAMBAR QRIS ============ */
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      const res = await fetch(QRIS_URL, { mode: 'cors', cache: 'force-cache' });
      if (!res.ok) throw new Error('fetch gagal');
      const blob = await res.blob();

      if (navigator.clipboard && window.ClipboardItem) {
        const item = new ClipboardItem({ [blob.type]: blob });
        await navigator.clipboard.write([item]);
        showToast('✓ QRIS TERSALIN');
        return;
      }
      throw new Error('Clipboard API tidak didukung');
    } catch (err) {
      try {
        await navigator.clipboard.writeText(QRIS_URL);
        showToast('✓ LINK QRIS TERSALIN');
      } catch (e) {
        window.prompt('Salin link QRIS di bawah:', QRIS_URL);
        showToast('📋 SALIN MANUAL');
      }
    }
  });

  /* ============ DOWNLOAD GAMBAR QRIS ============ */
  document.getElementById('downloadBtn').addEventListener('click', async () => {
    try {
      const res = await fetch(QRIS_URL, { mode: 'cors', cache: 'force-cache' });
      if (!res.ok) throw new Error('fetch gagal');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'QRIS-DIKZZ-STORE.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setTimeout(() => URL.revokeObjectURL(url), 3000);
      showToast('⬇️ DOWNLOAD BERHASIL');
    } catch (err) {
      window.open(QRIS_URL, '_blank');
      showToast('⬇️ BUKA GAMBAR');
    }
  });
})();
</script>

</body>
</html>
